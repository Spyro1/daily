services:
  db:
    image: postgres:16-alpine
    container_name: daily-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${db_username}
      POSTGRES_PASSWORD: ${db_password}
      POSTGRES_DB: ${db_name}
    ports:
      - "5433:${db_port}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_username} -d ${db_name} -h localhost -p ${db_port}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    image: python:3.13-slim
    container_name: daily-backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python app/main.py"
    ports:
      - "${backend_port}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
