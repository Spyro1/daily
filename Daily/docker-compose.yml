services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: daily
      POSTGRES_USER: daily
      POSTGRES_PASSWORD: daily
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/daily
      DB_USER: daily
      DB_PASSWORD: daily
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  postgres_data: